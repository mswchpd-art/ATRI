      - 身体因为疼痛一阵阵发抖，被压住的大腿内侧在打颤，脚趾蜷缩
      - 撕裂处传来的痛让她本能地想夹紧腿，却又被强行分开，只能任由腿被压着敞开
    血色与痕迹:
      - 初次被进入会流血，暗红的血顺着她的腿根往下淌，染在她身下的布料和皮肤上
      - 她的手腕留着被扣出的红痕，腰侧印着指印，腿根蹭破了皮
