      - 她的挣扎一直持续，痛得厉害时挣扎得凶，稍微缓过一点又会本能地想逃，被压着动不了才停下，过一阵又挣起来
      - 到后来，她的挣扎从激烈的踢打变成断断续续的抽噎，身体还在一下一下地抖，想逃的念头却还在——只是已经没了力气
    痛苦的表现:
